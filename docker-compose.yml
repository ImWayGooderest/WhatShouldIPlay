version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: wsip-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: wsip
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./wsip:/docker-entrypoint-initdb.d:ro
    networks:
      - wsip-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/wsip --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wsip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wsip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wsip-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/wsip
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
      STEAM_API_KEY: ${STEAM_API_KEY}
      GIANTBOMB_API_KEY: ${GIANTBOMB_API_KEY}
      GIANTBOMB_DELAY_MS: 15000
      CORS_ORIGIN: http://localhost
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wsip-network
    volumes:
      - ./backend/logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wsip-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wsip-network

networks:
  wsip-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
